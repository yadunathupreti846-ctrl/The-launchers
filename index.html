<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Prashant Upreti | Home – Rain & Forest</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --text-light: #f0f7ea;
      --accent-rain: #8bc34a;
      --overlay-dark: rgba(10, 20, 5, 0.55);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a1f0e;
      color: var(--text-light);
      overflow-x: hidden;
    }

    /* Rain & forest background */
    .hero-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background: url('https://images.pexels.com/photos/1431822/pexels-photo-1431822.jpeg?auto=compress&cs=tinysrgb&w=1600') no-repeat center center/cover;
      animation: slowZoom 20s infinite alternate;
    }

    @keyframes slowZoom {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    /* Rain effect */
    .rain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }
    .rain i {
      position: absolute;
      background: rgba(255, 255, 255, 0.4);
      width: 2px;
      border-radius: 0 0 2px 2px;
      animation: fall linear infinite;
    }
    @keyframes fall {
      to { transform: translateY(100vh); }
    }

    /* Dark overlay for readability */
    .hero-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--overlay-dark);
      z-index: -1;
    }

    /* Header */
    header {
      padding: 28px 0;
      position: sticky;
      top: 0;
      backdrop-filter: blur(12px);
      background: rgba(0, 0, 0, 0.4);
      z-index: 100;
      border-bottom: 1px solid rgba(139, 195, 74, 0.3);
    }
    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 28px;
    }
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 800;
      color: #e0f2d0;
      text-shadow: 2px 2px 6px #1a3f1a;
      letter-spacing: -0.5px;
    }
    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      font-weight: 600;
      color: #f1f9e8;
      transition: 0.3s;
      font-size: 1.05rem;
    }
    .nav-links a:hover {
      color: #c8ffa0;
      text-shadow: 0 0 8px #8bc34a;
    }
    .dark-toggle {
      background: #2c3e2f;
      border: none;
      border-radius: 60px;
      width: 44px;
      height: 44px;
      font-size: 1.3rem;
      cursor: pointer;
      color: #f9c74f;
      transition: 0.2s;
    }

    /* Hero section - FULLSCREEN */
    .hero {
      min-height: 92vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .hero-content h1 {
      font-size: 5.2rem;
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      background: linear-gradient(135deg, #f9f9c5, #b9f6a5, #6bcb77);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      animation: floatText 3s infinite alternate ease-in-out;
      margin-bottom: 20px;
    }
    @keyframes floatText {
      0% { transform: translateY(0px); text-shadow: 0 0 5px #8bc34a; }
      100% { transform: translateY(-15px); text-shadow: 0 0 20px #b9ff8c; }
    }
    .hero-content p {
      font-size: 1.7rem;
      font-weight: 400;
      margin-bottom: 32px;
      backdrop-filter: blur(4px);
      display: inline-block;
      padding: 8px 24px;
      border-radius: 60px;
      background: rgba(0,0,0,0.3);
    }
    .btn-group {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary, .btn-outline {
      padding: 14px 34px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
      letter-spacing: 1px;
    }
    .btn-primary {
      background: #3b7a3e;
      color: white;
      box-shadow: 0 8px 18px rgba(0,0,0,0.3);
      border: 1px solid #8bc34a;
    }
    .btn-primary:hover {
      transform: translateY(-6px) scale(1.02);
      background: #2e6b31;
      box-shadow: 0 18px 28px -8px #6bb34b;
    }
    .btn-outline {
      border: 2px solid #e0f2d0;
      color: #e0f2d0;
      background: transparent;
      backdrop-filter: blur(8px);
    }
    .btn-outline:hover {
      background: #e0f2d0;
      color: #1a3f1a;
      transform: translateY(-6px);
    }

    /* Floating WhatsApp */
    .whatsapp-float {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: #25D366;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      color: white;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(0,0,0,0.4);
      transition: 0.3s;
      z-index: 99;
    }
    .whatsapp-float:hover {
      transform: scale(1.12);
      background: #1da85c;
    }

    footer {
      text-align: center;
      padding: 28px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      font-size: 0.9rem;
    }

    @media (max-width: 800px) {
      .hero-content h1 { font-size: 2.8rem; }
      .hero-content p { font-size: 1.2rem; }
      .nav-links { gap: 18px; }
      .logo { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="rain" id="rainContainer"></div>

  <header>
    <div class="container nav-bar">
      <div class="logo">Prashant </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="education.html">Education</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
    </div>
  </header>

  <main>
    <div class="hero">
      <div class="hero-content">
        <h1>Prashant Upreti</h1>
        <p><i class="fas fa-cloud-rain"></i> Rain lover · Creator · Student <i class="fas fa-headphones"></i></p>
        <div class="btn-group">
          <a href="contact.html" class="btn-primary">Let's Connect 🌿</a>
          <a href="projects.html" class="btn-outline">View Work</a>
        </div>
      </div>
    </div>
  </main>

  <footer>© 2026 Prashant Upreti — Rainy forest vibes. Every drop inspires code.</footer>
  <a href="https://wa.me/9779848999394" class="whatsapp-float" target="_blank"><i class="fab fa-whatsapp"></i></a>

  <script>
    // Rain animation
    function createRain() {
      const rainContainer = document.getElementById('rainContainer');
      const drops = 180;
      for (let i = 0; i < drops; i++) {
        let drop = document.createElement('i');
        drop.style.left = Math.random() * 100 + '%';
        drop.style.width = Math.random() * 2 + 1.5 + 'px';
        drop.style.height = Math.random() * 18 + 10 + 'px';
        drop.style.animationDuration = Math.random() * 1.5 + 0.8 + 's';
        drop.style.animationDelay = Math.random() * 5 + 's';
        drop.style.opacity = Math.random() * 0.5 + 0.2;
        rainContainer.appendChild(drop);
      }
    }
    createRain();

    // Dark mode toggle (light/dark background overlay)
    const toggle = document.getElementById('darkToggle');
    const body = document.body;
    const overlay = document.querySelector('.hero-overlay');
    toggle.addEventListener('click', () => {
      body.classList.toggle('dark');
      if (body.classList.contains('dark')) {
        overlay.style.background = 'rgba(0, 0, 0, 0.8)';
        toggle.innerHTML = '<i class="fas fa-sun"></i>';
        localStorage.setItem('theme', 'dark');
      } else {
        overlay.style.background = 'rgba(10, 20, 5, 0.55)';
        toggle.innerHTML = '<i class="fas fa-moon"></i>';
        localStorage.setItem('theme', 'light');
      }
    });
    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark');
      overlay.style.background = 'rgba(0, 0, 0, 0.8)';
      toggle.innerHTML = '<i class="fas fa-sun"></i>';
    }
  </script>
</body>
</html>
