<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Prashant Upreti</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --accent-green: #3b7a3e; --text-primary: #2c3e2f; --card-bg: rgba(255,255,245,0.9); }
    body.dark { --text-primary: #e2f0da; --card-bg: rgba(30,40,25,0.9); --accent-green: #8bc34a; }
    body {
      font-family: 'Inter', sans-serif;
      background: url('https://images.pexels.com/photos/462162/pexels-photo-462162.jpeg?auto=compress&cs=tinysrgb&w=1600') no-repeat center center fixed;
      background-size: cover;
      color: var(--text-primary);
    }
    body::before { content: ""; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: -1; }
    body.dark::before { background: rgba(0,0,0,0.75); }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    header { background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); padding: 24px 0; position: sticky; top:0; z-index: 100; }
    .nav-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: #f5f5dc; }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a { text-decoration: none; font-weight: 500; color: #f0f0e0; transition: 0.3s; }
    .nav-links a:hover { color: #c8e6b5; text-shadow: 0 0 6px #8bc34a; }
    .dark-toggle { background: #2c3e2f; border: none; border-radius: 60px; width: 44px; height: 44px; cursor: pointer; color: #f9c74f; }
    .contact-section { padding: 80px 0; }
    .section-title { font-size: 2.8rem; font-family: 'Playfair Display', serif; margin-bottom: 48px; border-left: 6px solid #8bc34a; padding-left: 20px; }
    .contact-flex { display: flex; flex-wrap: wrap; gap: 50px; justify-content: space-between; }
    .form-container, .social-container { background: var(--card-bg); backdrop-filter: blur(16px); border-radius: 32px; padding: 32px; flex: 1; min-width: 260px; transition: transform 0.3s; }
    .form-container:hover, .social-container:hover { transform: translateY(-6px); }
    input, textarea { width: 100%; padding: 14px 18px; margin: 12px 0; background: rgba(255,255,245,0.7); border: 1px solid #b0c4a2; border-radius: 60px; font-family: inherit; }
    button[type="submit"] { background: #25D366; border: none; padding: 12px 32px; border-radius: 60px; font-weight: bold; color: white; cursor: pointer; transition: 0.3s; width: 100%; }
    button[type="submit"]:hover { background: #20b359; transform: scale(1.02); }
    .social-icons { display: flex; gap: 28px; margin: 30px 0; flex-wrap: wrap; }
    .social-icons a { font-size: 2.2rem; color: #4a6741; transition: 0.2s; }
    .social-icons a:hover { color: #3b7a3e; transform: translateY(-8px); }
    .contact-email { margin-top: 20px; font-size: 1.1rem; display: flex; align-items: center; gap: 12px; }
    .whatsapp-float { position: fixed; bottom: 28px; right: 28px; background: #25D366; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; color: white; text-decoration: none; box-shadow: 0 6px 18px rgba(0,0,0,0.3); transition: 0.3s; z-index: 99; }
    footer { text-align: center; padding: 32px; margin-top: 60px; background: rgba(0,0,0,0.5); color: #ddd; }
  </style>
</head>
<body>
  <header>
    <div class="container nav-bar">
      <div class="logo">Prashant </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="education.html">Education</a></li><li><a href="projects.html">Projects</a></li><li><a href="contact.html">Contact</a></li>
      </ul>
      <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
    </div>
  </header>
  <main class="contact-section">
    <div class="container">
      <h2 class="section-title">Let's Talk</h2>
      <div class="contact-flex">
        <div class="form-container">
          <p><i class="fab fa-whatsapp"></i> Fill the form, I'll reply on WhatsApp instantly.</p>
          <form id="whatsappForm">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <textarea rows="4" id="message" placeholder="Your message..." required></textarea>
            <button type="submit"><i class="fab fa-whatsapp"></i> Send via WhatsApp</button>
          </form>
        </div>
        <div class="social-container">
          <h3>Connect Naturally</h3>
          <div class="social-icons">
            <a href="https://www.instagram.com/upreti8_26" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@upreti_26" target="_blank"><i class="fab fa-tiktok"></i></a>
            <a href="https://www.facebook.com/prashant.upreti.2025" target="_blank"><i class="fab fa-facebook"></i></a>
          </div>
          <div class="contact-email"><i class="fas fa-envelope"></i> uparsant@gmail.com</div>
          <div class="contact-email"><i class="fas fa-phone-alt"></i> +977 9848999394</div>
        </div>
      </div>
    </div>
  </main>
  <footer>© 2026 Prashant Upreti — Flowing like a stream</footer>
  <a href="https://wa.me/9779848999394" class="whatsapp-float" target="_blank"><i class="fab fa-whatsapp"></i></a>
  <script>
    const toggle = document.getElementById('darkToggle');
    const body = document.body;
    toggle.addEventListener('click', () => { body.classList.toggle('dark'); localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light'); });
    if (localStorage.getItem('theme') === 'dark') body.classList.add('dark');

    const form = document.getElementById('whatsappForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('message').value.trim();
      if (!name || !email || !msg) return alert('Please fill all fields.');
      const fullMsg = `🌿 Portfolio Contact\nName: ${name}\nEmail: ${email}\nMessage: ${msg}`;
      const url = `https://wa.me/9779848999394?text=${encodeURIComponent(fullMsg)}`;
      window.open(url, '_blank');
      form.reset();
    });
  </script>
</body>
</html>
